name: Sync permanent merchant registry

on:
  push:
    branches: [main]
    paths:
      - merchant_registry.py
      - merchant_registry_seed.json
      - scripts/sync_merchant_registry.py
      - .github/workflows/sync-merchant-registry.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-merchant-registry
  cancel-in-progress: false

jobs:
  sync-registry:
    if: github.repository == 'Yeahpromos/offer-intelligence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MySQL client
        run: pip install PyMySQL==1.1.1
      - name: Persist profiles and verify Direct membership
        env:
          OFFER_DB_HOST: ${{ vars.OFFER_DB_HOST }}
          OFFER_DB_NAME: ${{ vars.OFFER_DB_NAME }}
          OFFER_DB_USER: ${{ vars.OFFER_DB_USER }}
          OFFER_DB_PASSWORD: ${{ secrets.OFFER_DB_PASSWORD }}
          OFFER_DB_PORT: ${{ vars.OFFER_DB_PORT }}
          OFFER_DB_READ_TIMEOUT: '300'
        run: python scripts/sync_merchant_registry.py --apply
